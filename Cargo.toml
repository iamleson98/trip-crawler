[package]
name = "vexerers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reverse-engineered Rust client + crawler for the VeXeRe public bus-trip APIs (trip search, areas, schedules, counts). Anonymous-only; no booking or payment."
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/vexerers"
keywords = ["vexere", "vietnam", "bus", "crawler", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "vexerers"
path = "src/lib.rs"

[[bin]]
name = "vexere"
path = "src/bin/vexere.rs"

[dependencies]
# HTTP + async runtime
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Errors & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Time & misc
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
url = "2"
rand = "0.8"
async-trait = "0.1"
once_cell = "1"

# Optional speed: jiff for date arithmetic would be nicer, but `time` is fine.

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
insta = "1"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1  # speed up dev builds slightly for HTTP-heavy testing
